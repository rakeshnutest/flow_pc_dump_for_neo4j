services:
  influxdb:
    image: influxdb:2.7
    ports:
      - "${INFLUX_BIND:-127.0.0.1:8087}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: conntrack123
      DOCKER_INFLUXDB_INIT_ORG: conntrack
      DOCKER_INFLUXDB_INIT_BUCKET: conntrack
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: conntrack-admin-token
      DOCKER_INFLUXDB_INIT_RETENTION: 0
    volumes:
      - influx-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 36

  ingest:
    build: ./ingest
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: conntrack-admin-token
      INFLUX_ORG: conntrack
      INFLUX_BUCKET: conntrack
      CSV_DIR: /data
      MAPPING_PATH: /data/mapping.json
      WRITE_BATCH: "5000"
    volumes:
      - ${DATA_DIR:-../sample_data}:/data:ro
    restart: "on-failure"

  grafana:
    image: grafana/grafana:10.4.2
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "${GRAFANA_BIND:-0.0.0.0:3100}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: conntrack123
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/conntrack-rates.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  influx-data:
  grafana-data:
